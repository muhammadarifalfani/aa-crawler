[project]
name = "aa-crawler"
version = "0.1.0"
description = "Production-ready multi-platform media crawling and monitoring framework."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Muhammad Arif Alfani" },
]
dependencies = [
    "httpx>=0.28.1,<0.29",
    "pydantic-settings>=2.14.2,<2.15",
]

[project.scripts]
aa-crawler = "aa_crawler:main"

[dependency-groups]
dev = [
    "mypy>=2.1,<3",
    "pre-commit>=4,<5",
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.15,<0.16",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-exclude = [
    "/data",
    "/logs",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]
extend-exclude = [
    "data",
    "logs",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "TCH",
    "C901",
    "ARG",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true

warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

pretty = true
show_error_codes = true
show_error_context = true

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["aa_crawler"]
relative_files = true
omit = [
    "tests/*",
]

[tool.coverage.report]
fail_under = 70
precision = 2
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "htmlcov"
